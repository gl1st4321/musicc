<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Название трека</title>
<meta name="theme-color" content="#0e0e12">
<style>
  :root {
    --bg: #0e0e12;
    --card: #1a1a22;
    --text: #f2f2f5;
    --muted: #8a8a99;
    --accent: #ff4d6d;
    --track: #2c2c38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #2a1520 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .player {
    width: 100%; max-width: 380px;
    background: var(--card);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    text-align: center;
  }
  .cover {
    width: 100%; aspect-ratio: 1; border-radius: 20px;
    background: linear-gradient(135deg, #ff4d6d, #7b2cbf);
    background-size: cover; background-position: center;
    margin-bottom: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 72px;
    transition: transform .4s ease;
    transform: scale(.94);
  }
  .playing .cover { transform: scale(1); }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .artist { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
  .bar {
    position: relative; height: 6px; background: var(--track);
    border-radius: 3px; cursor: pointer; touch-action: none;
  }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 3px; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .play {
    margin: 20px auto 0; width: 76px; height: 76px; border-radius: 50%;
    border: 0; background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(255,77,109,.4);
    transition: transform .15s;
  }
  .play:active { transform: scale(.92); }
  .play svg { width: 32px; height: 32px; fill: currentColor; }
  .icon-pause { display: none; }
  .playing .icon-play { display: none; }
  .playing .icon-pause { display: block; }
</style>
</head>
<body>
  <main class="player" id="player">
    <!-- Обложка: положи cover.jpg рядом, добавь style="background-image:url('cover.jpg')" и убери 🎵 -->
    <div class="cover" id="cover">🎵</div>
    <h1>Название трека</h1>
    <div class="artist">Исполнитель</div>

    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>

    <button class="play" id="play" aria-label="Играть">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <audio id="audio" src="track.mp3" preload="metadata"></audio>
  </main>

<script>
  const audio = document.getElementById('audio');
  const player = document.getElementById('player');
  const fill = document.getElementById('fill');
  const bar = document.getElementById('bar');
  const cur = document.getElementById('cur');
  const dur = document.getElementById('dur');

  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';

  document.getElementById('play').onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay = () => player.classList.add('playing');
  audio.onpause = () => player.classList.remove('playing');
  audio.onloadedmetadata = () => dur.textContent = fmt(audio.duration);
  audio.ontimeupdate = () => {
    cur.textContent = fmt(audio.currentTime);
    fill.style.width = (audio.currentTime / audio.duration * 100 || 0) + '%';
  };

  const seek = e => {
    const r = bar.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    if (audio.duration) audio.currentTime = x / r.width * audio.duration;
  };
  bar.addEventListener('pointerdown', e => {
    seek(e);
    bar.setPointerCapture(e.pointerId);
    bar.onpointermove = seek;
  });
  bar.addEventListener('pointerup', () => bar.onpointermove = null);
</script>
</body>
</html>
